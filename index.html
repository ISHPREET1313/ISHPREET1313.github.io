<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignitia 2025 | UPES Tech Fest</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Landing Section -->
    <section class="landing">
        <img src="assets/logo.png" alt="Fest Logo" width="700">
        <h1>Robotics Fest</h1>
        <br>
    </section>
    <hr>

    <!-- Sponsors Section -->
    <section class="sponsors">
        <h2>Our Sponsors</h2>
        <div class="sponsor">
            <img src="assets/taco-bell.png" alt="Fest Logo" width="200">
            <br />
            <h3>Taco Bell</h3>
        </div>
    </section>

    <hr>
    <!-- Events Section -->
    <section class="events">
        <h2>Events</h2>
        <div class="events-grid">
            <div class="event-card">
                <img src="assets/robo-race.png" alt="Fest Logo" width="275">
                <h3>Robo Race</h3>
                <p>Robots race through obstacle tracks.</p>
            </div>
            <div class="event-card">
                <img src="assets/tech-trivia.png" alt="Fest Logo" width="275">
                <h3>Tech trivia</h3>
                <p>Test Your Knowledge.</p>
            </div>
        </div>
        <hr>
    </section>

    <!-- Team Section -->
    <section class="team">
        <h2>Organizing Team</h2>
        <div class="member">
            <div class="member-logo">
                <h4>IS</h4>
            </div>
            <p>Ishpreet Singh</p>
        </div>
        <hr>
    </section>

    <!-- Contact Section -->
    <section class="contact">
        <h2>Contact Us</h2>
        <p>Email:Ishpreet.22434@stu.upes.ac.in</p>
        <br />
        <p><a href="https://github.com/ISHPREET1313" target="_main">Github</a></p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Ignitia Fest | Organized by Hypervision</p>
    </footer>

</body>

</html>
